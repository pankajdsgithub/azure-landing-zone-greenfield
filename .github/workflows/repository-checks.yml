name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-quality:
    name: Terraform Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.62.1

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize management-groups environment
        run: terraform -chdir=terraform/environments/management-groups init -backend=false

      - name: Validate management-groups environment
        run: terraform -chdir=terraform/environments/management-groups validate

      - name: Initialize platform environment
        run: terraform -chdir=terraform/environments/platform init -backend=false

      - name: Validate platform environment
        run: terraform -chdir=terraform/environments/platform validate

      - name: Initialize governance environment
        run: terraform -chdir=terraform/environments/governance init -backend=false

      - name: Validate governance environment
        run: terraform -chdir=terraform/environments/governance validate

      - name: Initialize identity environment
        run: terraform -chdir=terraform/environments/identity init -backend=false

      - name: Validate identity environment
        run: terraform -chdir=terraform/environments/identity validate

      - name: Initialize networking environment
        run: terraform -chdir=terraform/environments/networking init -backend=false

      - name: Validate networking environment
        run: terraform -chdir=terraform/environments/networking validate

      - name: Initialize corp environment
        run: terraform -chdir=terraform/environments/corp init -backend=false

      - name: Validate corp environment
        run: terraform -chdir=terraform/environments/corp validate

      - name: Initialize online environment
        run: terraform -chdir=terraform/environments/online init -backend=false

      - name: Validate online environment
        run: terraform -chdir=terraform/environments/online validate

      - name: Check networking CIDR validation
        run: |
          python3 -m py_compile scripts/validate-network-cidrs.py
          python3 scripts/validate-network-cidrs.py --var-file terraform/environments/networking/terraform.tfvars.example --self-test

      - name: Initialize state backend bootstrap
        run: terraform -chdir=terraform/bootstrap/state-backend init -backend=false

      - name: Validate state backend bootstrap
        run: terraform -chdir=terraform/bootstrap/state-backend validate

      - name: Lint management-groups environment
        run: tflint --chdir=terraform/environments/management-groups

      - name: Lint platform environment
        run: tflint --chdir=terraform/environments/platform

      - name: Lint governance environment
        run: tflint --chdir=terraform/environments/governance

      - name: Lint identity environment
        run: tflint --chdir=terraform/environments/identity

      - name: Lint networking environment
        run: tflint --chdir=terraform/environments/networking

      - name: Lint corp environment
        run: tflint --chdir=terraform/environments/corp

      - name: Lint online environment
        run: tflint --chdir=terraform/environments/online

      - name: Lint state backend bootstrap
        run: tflint --chdir=terraform/bootstrap/state-backend

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            docs/architecture.md
            docs/design-decisions.md
            docs/deployment-guide.md
            docs/rbac-security-review.md
            architecture/landing-zone-flow.mmd
            terraform/bootstrap/README.md
            terraform/modules/management-groups/README.md
            terraform/environments/README.md
            terraform/environments/corp/README.md
            terraform/environments/online/README.md
            policies/README.md
            examples/README.md
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file missing or empty: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check for committed Terraform state files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)(terraform\.tfstate|terraform\.tfstate\.backup)$'; then
            echo "::error::Terraform state files must not be committed."
            exit 1
          fi

          echo "No tracked Terraform state files found."
