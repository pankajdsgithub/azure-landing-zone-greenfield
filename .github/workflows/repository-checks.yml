name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-quality:
    name: Terraform Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize platform environment
        run: terraform -chdir=terraform/environments/platform init -backend=false

      - name: Validate platform environment
        run: terraform -chdir=terraform/environments/platform validate

      - name: Initialize governance environment
        run: terraform -chdir=terraform/environments/governance init -backend=false

      - name: Validate governance environment
        run: terraform -chdir=terraform/environments/governance validate

  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            docs/architecture.md
            docs/design-decisions.md
            docs/deployment-guide.md
            architecture/landing-zone-flow.mmd
            terraform/bootstrap/README.md
            terraform/modules/management-groups/README.md
            terraform/environments/README.md
            policies/README.md
            examples/README.md
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file missing or empty: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check for committed Terraform state files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)(terraform\.tfstate|terraform\.tfstate\.backup)$'; then
            echo "::error::Terraform state files must not be committed."
            exit 1
          fi

          echo "No tracked Terraform state files found."
